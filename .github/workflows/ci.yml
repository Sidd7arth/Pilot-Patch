name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: patchpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-commit / CI secret scan (SEC-03)
        run: pnpm check:secrets

      - name: Check code formatting (Prettier)
        run: pnpm format:check

      - name: Architectural lint & module boundaries (ESLint)
        run: pnpm lint

      - name: Strict typecheck (TypeScript)
        run: pnpm typecheck

      - name: Run automated test suites (Vitest)
        env:
          DATABASE_URL: postgres://user:password@localhost:5432/patchpilot
          SESSION_SECRET: test-github-actions-ci-secret-32-chars-long!
        run: pnpm test

      - name: Build applications and packages
        run: pnpm build

      - name: Client bundle secret scan (SEC-04)
        run: pnpm check:bundle
